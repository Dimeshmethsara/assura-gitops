apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.6
    helm:
      values: |
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without this, ArgoCD applies manifests the same way `kubectl apply` does client-side:
      # storing the full previous manifest in a kubectl.kubernetes.io/last-applied-configuration
      # annotation, capped by Kubernetes at 262144 bytes total annotation size. Kyverno's
      # ClusterPolicy/Policy CRDs carry a very large OpenAPI schema (covering validate/mutate/
      # generate/imageVerify rules) and blow past that cap, so the CRD silently fails to apply
      # while this chart's smaller CRDs succeed. Confirmed live: `kubectl get crd` showed 7 of 9
      # Kyverno CRDs present, missing exactly clusterpolicies.kyverno.io and policies.kyverno.io
      # — and kyverno-admission-controller was stuck in CrashLoopBackOff on its own startup
      # sanity check ("failed to check CRD clusterpolicies.kyverno.io is installed ... not
      # found"). Server-side apply uses field-manager metadata instead of that annotation, so it
      # has no such size limit — this is the documented fix for this exact class of failure.
      - ServerSideApply=true
