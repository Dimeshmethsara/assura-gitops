apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    # 5.9.54 ships Jenkins core 2.568.2. Was 5.7.15 (core 2.479.2), which could not boot: the
    # pinned plugins below resolve their *transitive* dependencies to whatever the update centre
    # currently serves, and those now require a newer core. The init container failed the install
    # outright with a wall of "requires a greater version of Jenkins (2.504.3) than 2.479.2",
    # leaving jenkins-0 in Init:CrashLoopBackOff. Pinning a plugin does not pin its dependency
    # tree, so the controller image has to stay ahead of what those dependencies demand.
    targetRevision: 5.9.54
    helm:
      values: |
        controller:
          # RBAC scoped to managing pods in jenkins-agents only — deliberately NOT cluster-admin,
          # the most common Jenkins-in-Kubernetes misconfiguration. serviceAccount below carries
          # no AWS IRSA role: the controller itself never touches AWS; only agent pods do.
          serviceAccount:
            create: true
            name: jenkins-controller
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          # Intentionally unpinned. These were pinned to exact versions, which does NOT pin their
          # dependency trees — the plugin manager still resolves transitive deps to latest, and
          # the two sets drifted apart until installation failed outright:
          #   "Plugin git:5.4.1 (via git-client:6.6.1) depends on configuration-as-code:2036...,
          #    but there is an older version defined on the top level - configuration-as-code:1878..."
          # Partial pinning is strictly worse than none: it produces an unsatisfiable set rather
          # than a reproducible one. Reproducibility here comes from the pinned chart version
          # (5.9.54 → core 2.568.2) instead, which bounds what the resolver can pick.
          #
          # The production-grade answer is a lockfile: run jenkins-plugin-manager to resolve the
          # full closure once, commit the generated plugins.txt, and bake it into a custom
          # controller image. That is real work for a demo cluster and is noted as a follow-up
          # rather than done here.
          installPlugins:
            - kubernetes
            - workflow-aggregator
            - git
            - configuration-as-code
          JCasC:
            defaultConfig: true
            configScripts:
              # Ephemeral, per-stage agent pods — one Jenkins build never leaves a long-lived
              # agent sitting around; capacity scales to zero when nothing is building.
              kubernetes-cloud: |
                jenkins:
                  clouds:
                    - kubernetes:
                        name: "kubernetes"
                        namespace: "jenkins-agents"
                        jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                        containerCapStr: "10"
                        # `templates`, not `podTemplates`: JCasC derives its schema from the
                        # KubernetesCloud setters, and the property is setTemplates(). Using
                        # podTemplates aborted Jenkins startup entirely rather than being
                        # ignored — "UnknownAttributesException: kubernetes: Invalid
                        # configuration elements for type: ...KubernetesCloud : podTemplates",
                        # which fails the whole InitReactor and crashloops the controller.
                        templates:
                          - name: "dotnet-sdk"
                            label: "dotnet-sdk"
                            containers:
                              - name: "dotnet-sdk"
                                image: "mcr.microsoft.com/dotnet/sdk:8.0"
                                command: "sleep"
                                args: "99d"
                          - name: "node"
                            label: "node"
                            containers:
                              - name: "node"
                                image: "node:22-alpine"
                                command: "sleep"
                                args: "99d"
                          - name: "kaniko"
                            label: "kaniko"
                            serviceAccount: "jenkins-agent"
                            containers:
                              - name: "kaniko"
                                image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                                command: "sleep"
                                args: "9999999"
                          - name: "trivy"
                            label: "trivy"
                            containers:
                              - name: "trivy"
                                image: "aquasec/trivy:0.56.2"
                                command: "sleep"
                                args: "99d"
                          - name: "syft-cosign"
                            label: "syft-cosign"
                            serviceAccount: "jenkins-agent"
                            containers:
                              # Plain Alpine, not the official syft/cosign images: both of those
                              # are shell-less/distroless (verified directly — neither has `sh`
                              # or a standalone `sleep`), so the usual "sleep as keep-alive so
                              # Jenkins can exec into it" pattern can't work on them at all. The
                              # Jenkinsfile fetches the syft/cosign binaries onto this container
                              # at pipeline runtime instead, the same way it already does for yq.
                              - name: "syft-cosign"
                                image: "alpine:3.20"
                                command: "sleep"
                                args: "99d"
                          - name: "git"
                            label: "git"
                            # Needs AWS access too: this pod fetches the GitHub push credential
                            # from Secrets Manager at pipeline runtime (see the Jenkinsfiles'
                            # "Update GitOps manifest" stage) rather than storing it in Jenkins's
                            # own credential store — same IRSA role as kaniko/syft-cosign, whose
                            # policy also grants secretsmanager:GetSecretValue on just that one
                            # secret (see assura-infra/modules/iam-irsa).
                            serviceAccount: "jenkins-agent"
                            containers:
                              - name: "git"
                                image: "alpine/git:2.47.1"
                                command: "sleep"
                                args: "99d"
        agent:
          # The chart's own default "jnlp" agent pod (used only for lightweight orchestration
          # steps) still needs its own service account tied to the jenkins-agent IRSA role for
          # ECR auth + cosign KMS signing.
          serviceAccount: "jenkins-agent"
        persistence:
          size: 8Gi
        # Indented to 8 spaces so it sits INSIDE the `values: |` block above. At 6 spaces it was a
        # sibling of `values:` under `helm:`, where ArgoCD's Application schema has no such field,
        # so the API server silently pruned it — the ServiceAccount was never created and
        # root-app sat permanently OutOfSync (git had a key the live object could never keep).
        # Silent, because pruning an unknown field is not an error: the only visible symptom was
        # the sync status. The agent podTemplates above all set serviceAccount: "jenkins-agent",
        # so without this every CI build would fail to start its pod.
        extraObjects:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: jenkins-agent
              namespace: jenkins-agents
              annotations:
                eks.amazonaws.com/role-arn: "arn:aws:iam::187691954427:role/assura-demo-jenkins-agent"
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
