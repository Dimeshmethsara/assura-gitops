apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: assura-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/Dimeshmethsara/assura-gitops.git
    targetRevision: main
    path: charts/assura-frontend
    helm:
      valueFiles:
        - values.yaml
        - values-image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: assura-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
