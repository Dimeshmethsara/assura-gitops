replicaCount: 2

image:
  repository: 187691954427.dkr.ecr.us-east-1.amazonaws.com/assura-demo-frontend
  # tag comes from values-image.yaml — the one field Jenkins ever edits.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  # Same-origin relative path: the ALB routes /api to the backend service (see
  # assura-backend's ingress.yaml), so the browser never needs an absolute cross-origin URL —
  # keeps the nginx CSP's connect-src 'self' valid with no further configuration.
  API_URL: "/api"

ingress:
  groupName: assura
  # Empty = the Ingress rule matches any Host, so the ALB's own DNS name is browsable directly.
  # Set this (and assura-backend's, which must match) only once a real domain points at the ALB.
  host: ""

network:
  vpcCidr: "10.60.0.0/16"
