# Pulls the Terraform-generated DB credentials + JWT signing key from Secrets Manager into
# native k8s Secrets, refreshed hourly, remapped from the secret JSON's property names to the
# exact env var names AssuraBackend's DotNetEnv-based config already reads (see
# AssuraBackend/src/Assura.API/Program.cs) — so deployment.yaml's envFrom.secretRef needs zero
# backend code changes.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: assura-backend-secretstore
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: assura-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: assura-backend-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: assura-backend-secretstore
    kind: SecretStore
  target:
    name: assura-backend-db-credentials
  data:
    - secretKey: DB_SERVER
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: dbname
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: assura-backend-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: assura-backend-secretstore
    kind: SecretStore
  target:
    name: assura-backend-jwt
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: {{ .Values.secretsManager.jwtSecretArn | quote }}
        property: key
