# Pulls the Terraform-generated DB credentials + JWT signing key from Secrets Manager into
# native k8s Secrets, refreshed hourly, remapped from the secret JSON's property names to the
# exact env var names AssuraBackend's DotNetEnv-based config already reads (see
# AssuraBackend/src/Assura.API/Program.cs) — so deployment.yaml's envFrom.secretRef needs zero
# backend code changes.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: assura-backend-secretstore
  annotations:
    # Wave-ordered between the ServiceAccount (-4, whose IRSA identity this store's `auth.jwt`
    # authenticates as) and the ExternalSecrets below (-2, which reference this store by name).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No `auth` block on purpose: with none set, External Secrets Operator authenticates as its
      # OWN controller ServiceAccount (external-secrets/external-secrets), whose IRSA role
      # assura-demo-external-secrets carries the `read-secrets` policy granting
      # secretsmanager:GetSecretValue on assura-demo/* — see assura-infra/modules/iam-irsa.
      #
      # This previously specified `auth.jwt.serviceAccountRef: assura-backend`, which made ESO
      # assume the BACKEND pod's role instead. That role intentionally holds only S3+KMS, so
      # every fetch failed: "User: arn:aws:sts::...:assumed-role/assura-demo-backend/
      # external-secrets-provider-aws is not authorized to perform: secretsmanager:GetSecretValue".
      # Granting the backend role Secrets Manager access would have "fixed" it by widening the
      # workload's privileges to read every secret in the namespace prefix — the wrong direction.
      # The backend pod never needs Secrets Manager: it receives credentials as env vars from the
      # Secret this ExternalSecret materializes.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: assura-backend-db-credentials
  annotations:
    # One wave after the SecretStore it references. The migration Job (wave -1) consumes the
    # Secret this produces via envFrom.secretRef — that ordering is what fixes the live
    # CreateContainerConfigError seen when the Job ran before this Secret existed. ArgoCD waits
    # for an ExternalSecret to report Ready before advancing the wave, so the Secret is
    # guaranteed populated (not merely created) by the time the Job starts.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: assura-backend-secretstore
    kind: SecretStore
  target:
    name: assura-backend-db-credentials
  data:
    - secretKey: DB_SERVER
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: dbname
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secretsManager.dbCredentialsSecretArn | quote }}
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: assura-backend-jwt
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: assura-backend-secretstore
    kind: SecretStore
  target:
    name: assura-backend-jwt
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: {{ .Values.secretsManager.jwtSecretArn | quote }}
        property: key
