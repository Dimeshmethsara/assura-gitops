apiVersion: v1
kind: ServiceAccount
metadata:
  name: assura-backend
  labels:
    {{- include "assura-backend.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
    # Made a pre-install/pre-upgrade hook (weight -5, before everything else) rather than a plain
    # resource: without this, ArgoCD applies it in the normal Sync phase, which runs AFTER
    # PreSync hooks — but migration-job.yaml is a PreSync hook (weight 0) whose pod references
    # this exact ServiceAccount. Confirmed live: "pods ... forbidden: error looking up service
    # account assura-app/assura-backend: serviceaccount "assura-backend" not found" on every
    # attempt, because the SA that would have fixed it hadn't been created yet.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
