apiVersion: v1
kind: ServiceAccount
metadata:
  name: assura-backend
  labels:
    {{- include "assura-backend.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
    # Ordered ahead of everything else in this chart via an ArgoCD sync-wave. The migration Job
    # (wave -1) mounts this ServiceAccount, and the SecretStore (wave -3) authenticates to AWS
    # as its IRSA identity, so it has to exist first. Confirmed live before this was ordered:
    # "pods ... forbidden: error looking up service account assura-app/assura-backend:
    # serviceaccount \"assura-backend\" not found".
    #
    # Deliberately a sync-wave and NOT a helm.sh/hook: hook resources are untracked by ArgoCD,
    # so a ServiceAccount created as a hook would fall outside selfHeal/prune and silently stay
    # deleted if someone removed it. Waves give the same ordering while keeping it managed.
    argocd.argoproj.io/sync-wave: "-4"
