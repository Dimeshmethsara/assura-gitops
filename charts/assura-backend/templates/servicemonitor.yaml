apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: assura-backend
  labels:
    {{- include "assura-backend.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "assura-backend.labels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
