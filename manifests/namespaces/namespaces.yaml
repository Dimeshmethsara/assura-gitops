apiVersion: v1
kind: Namespace
metadata:
  name: assura-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins-agents
  labels:
    # Jenkins build agent pods (Kaniko etc.) need to build container image layers, which the
    # "restricted" profile's read-only-root-filesystem/no-extra-capabilities rules would block.
    # Confined to its own namespace, separate from assura-app, to keep that blast radius small.
    pod-security.kubernetes.io/enforce: baseline
